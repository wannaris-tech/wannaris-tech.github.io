<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pasar Mini Bijak</title>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Custom Animations and CSS -->
  <style>
    .bg-mint-50 { background-color: #f0fdfa; }
    .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    .animate-bounce-slight { animation: bounceSlight 3s ease-in-out infinite; }
    .animate-premium-float { animation: premiumFloat 3.5s ease-in-out infinite; }
    .animate-wobble { animation: wobble 0.5s ease-in-out; }
    .animate-invite { animation: invite 2.5s ease-in-out infinite; }
    
    .animate-conveyor { width: max-content; animation: slideLeft 25s linear infinite; }
    @keyframes slideLeft { 0% { transform: translateX(0); } 100% { transform: translateX(-25%); } }
    
    .shelf-3d {
      background: linear-gradient(180deg, #fed7aa 0%, #fdba74 30%, #ea580c 95%, #9a3412 100%);
      border-bottom: 4px solid #9a3412;
      border-radius: 6px;
    }
    
    @keyframes premiumFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    @keyframes bounceSlight { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    
    @keyframes wobble { 
      0%, 100% { transform: translateX(0); } 
      25% { transform: translateX(-5px) rotate(-1deg); } 
      75% { transform: translateX(5px) rotate(1deg); } 
    }

    @keyframes invite {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-3px) scale(1.01); }
    }

    @keyframes burst {
      0% { transform: scale(0); opacity: 1; }
      60% { opacity: 1; }
      100% { transform: scale(1.5); opacity: 0; }
    }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(-5deg) scale(0.8); opacity: 0; }
      10% { opacity: 1; transform: translateY(-10vh) rotate(5deg) scale(1); }
      90% { opacity: 1; transform: translateY(-90vh) rotate(-5deg) scale(1); }
      100% { transform: translateY(-120vh) rotate(5deg) scale(0.8); opacity: 0; }
    }
    
    @keyframes bubblePop {
      0% { transform: scale(1); opacity: 1; }
      40% { transform: scale(1.4); opacity: 0.8; }
      100% { transform: scale(2.2); opacity: 0; }
    }

    .animate-float-up { animation: floatUp 8s ease-in-out infinite; }
    .animate-bubble-pop { animation: bubblePop 0.3s ease-out forwards; }
    .animate-firework {
      animation: burst 2s ease-out infinite;
      transform-origin: center;
      opacity: 0;
      animation-fill-mode: forwards;
    }

    /* Hide number input spinners */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; margin: 0; 
    }
  </style>
</head>
<body class="bg-slate-200 font-sans overflow-hidden flex justify-center items-center min-h-screen">
  
  <!-- Audio Toggle Button -->
  <button 
    onclick="toggleAudio()"
    id="audio-btn"
    class="absolute top-2.5 right-2.5 sm:top-4 sm:right-4 z-50 bg-white/90 backdrop-blur px-2.5 py-1.5 sm:px-3.5 sm:py-2 rounded-full shadow-lg border-2 border-slate-300 font-bold text-slate-700 hover:bg-slate-50 active:scale-95 transition-all flex items-center justify-center text-xs sm:text-sm"
  >
    🔇 OFF
  </button>

  <!-- Main Application Container -->
  <div id="app" class="relative w-full h-[100dvh] max-w-md mx-auto shadow-2xl overflow-hidden bg-white sm:h-[90vh] sm:rounded-[40px] sm:border-[8px] border-slate-800 ring-4 ring-slate-300">
    <!-- UI will be rendered here by JS -->
  </div>

  <script>
    // ==========================================
    // 1. AUDIO ENGINE (Web Audio API)
    // ==========================================
    let audioCtx = null;
    let globalAudioEnabled = false;

    const initAudio = () => {
      try {
        if (!window.AudioContext && !window.webkitAudioContext) return false;
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return true;
      } catch (e) { return false; }
    };

    const playTone = (freq, type, duration, vol = 0.1) => {
      if (!globalAudioEnabled || !initAudio()) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    };

    const playMusic = () => {
      if (!globalAudioEnabled || !initAudio()) return;
      const notes = [392.00, 523.25, 659.25, 783.99]; 
      notes.forEach((freq, i) => {
        setTimeout(() => playTone(freq, 'sine', 0.4, 0.15), i * 150);
      });
    };

    const playCorrect = () => {
      if (!globalAudioEnabled || !initAudio()) return;
      playTone(600, 'sine', 0.1, 0.1);
      setTimeout(() => playTone(800, 'sine', 0.2, 0.15), 100);
    };

    const playWrong = () => {
      if (!globalAudioEnabled || !initAudio()) return;
      playTone(150, 'sawtooth', 0.4, 0.1); 
    };

    const playTing = () => {
      if (!globalAudioEnabled || !initAudio()) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.0);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 2.0);
    };

    window.toggleAudio = () => {
      globalAudioEnabled = !globalAudioEnabled;
      state.audioOn = globalAudioEnabled;
      document.getElementById('audio-btn').innerText = globalAudioEnabled ? '🎵 ON' : '🔇 OFF';
      if (globalAudioEnabled) initAudio();
      manageAudioLoops();
    };

    const enableAudio = () => {
      if (!globalAudioEnabled) {
        globalAudioEnabled = true;
        state.audioOn = true;
        document.getElementById('audio-btn').innerText = '🎵 ON';
        initAudio();
        manageAudioLoops();
      }
    };

    let bgInterval = null;
    let shopOsc = null;
    let shopGain = null;

    const manageAudioLoops = () => {
      // Clear existing
      if (bgInterval) clearInterval(bgInterval);
      if (shopOsc) { try { shopOsc.stop(); } catch(e){} shopOsc = null; }

      if (state.audioOn) {
        if (state.gameState !== 'shop' && state.gameState !== 'checkout' && state.gameState !== 'bubbleGame' && state.gameState !== 'cashier') {
          const melody = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63];
          let i = 0;
          bgInterval = setInterval(() => {
            if (audioCtx && audioCtx.state === 'running' && globalAudioEnabled) {
               playTone(melody[i % melody.length], 'sine', 0.15, 0.03);
               i++;
            }
          }, 450);
        } else if ((state.gameState === 'shop' || state.gameState === 'checkout' || state.gameState === 'cashier') && initAudio()) {
          const cheerfulMelody = [523.25, 659.25, 783.99, 659.25, 523.25, 783.99, 1046.50, 783.99];
          let j = 0;
          bgInterval = setInterval(() => {
            if (audioCtx && audioCtx.state === 'running' && globalAudioEnabled) {
               playTone(cheerfulMelody[j % cheerfulMelody.length], 'triangle', 0.12, 0.04);
               j++;
            }
          }, 220); 
        }
      }
    };

    // 2. DATA & CONSTANTS
    // ==========================================

      const val = Math.round(amount * 100) / 100;
      if (val === 0) return 'RM 0';

      if (Number.isInteger(val)) return `RM ${val}`;

    const CATALOG = [

      { id: 's11', icon: 'Tabung Duit', name: 'Tabung Duit', hint: "Hebat! Selesaikan Tahap 3A untuk isi tabung bank kamu." },
      { id: 's12', icon: 'Bangunan Bank Mini', name: 'Bank Mini', hint: "Misi menyimpan! Selesaikan Tahap 3B untuk simpan wang di sini." },
      { id: 's13', icon: 'Beg Duit Comel', name: 'Beg Duit Comel', hint: "Buka kunci bank ini dengan menyelesaikan cabaran di Tahap 3A!" },
      { id: 's14', icon: 'Kad Matrik Pintar', name: 'Kad Matrik - Epik', hint: "Maju ke depan! Dapatkan 3 Bintang ⭐⭐⭐ di Tahap 3B!" },
      { id: 's15', icon: 'Piala Juara', name: 'Piala Juara', hint: "Raih 3 bintang pada semua peringkat!" },
      { id: 's16', icon: 'Pingat Emas', name: 'Pingat Emas', hint: "Raih 3 bintang pada semua peringkat!" },
    ];

    const ALBUMS = [
      { id: 'a1', title: 'Pasar Raya Cilik', theme: 'bg-pink-100', stickerIds: ['s1', 's2', 's3', 's4', 's5'] },
      { id: 'a2', title: 'Kedai Aiskrim', theme: 'bg-sky-100', stickerIds: ['s6', 's7', 's8', 's9', 's10'] },
      { id: 'a3', title: 'Bank Mainan', theme: 'bg-orange-100', stickerIds: ['s11', 's12', 's13', 's14'] },
      { id: 'a4', title: 'Pentas Juara', theme: 'bg-yellow-100', stickerIds: ['s15', 's16'] },

    const REWARD_ITEMS = [
      { id: 'hat', name: 'Topi Juruwang', cost: 5, type: 'accessory', icon: '🧢', desc: 'Aksesori watak juruwang' },
      { id: 'balloon', name: 'Belon Ceria', cost: 8, type: 'decor', icon: '🎈', desc: 'Hiasan rak & kaunter kedai' },
      { id: 'apron', name: 'Apron Emas', cost: 10, type: 'accessory', icon: '🦺', desc: 'Aksesori watak juruwang' },

      { id: 'glasses', name: 'Cermin Mata', cost: 15, type: 'accessory', icon: '🕶️', desc: 'Aksesori watak juruwang' },
    ];

    const STORAGE_PREFIX = 'pasarMiniKPM_';

    // ==========================================
    // 3. UI COMPONENTS (HTML Template Strings)
    // ==========================================
    const Button3D = (text, onClickStr, color = 'blue', className = '', style = '') => {
      const colorMap = {
        blue: 'bg-sky-400 border-sky-600 shadow-[0_6px_0_theme(colors.sky.300)]',
        green: 'bg-teal-400 border-teal-600 shadow-[0_6px_0_theme(colors.teal.300)]',
        pink: 'bg-pink-400 border-pink-600 shadow-[0_6px_0_theme(colors.pink.300)]',
        orange: 'bg-orange-400 border-orange-600 shadow-[0_6px_0_theme(colors.orange.300)]',
        red: 'bg-red-400 border-red-600 shadow-[0_6px_0_theme(colors.red.300)]',
      };
      const activeShadow = 'active:shadow-none active:translate-y-1.5';
      return `
        <button onclick="${onClickStr}" style="${style}" class="relative inline-flex items-center justify-center px-6 py-3 font-bold text-white rounded-full border-2 transition-all duration-75 select-none ${colorMap[color] || colorMap.blue} ${activeShadow} ${className}">
          <span class="absolute top-0 left-0 w-full h-1/3 bg-white opacity-25 rounded-t-full pointer-events-none"></span>
          <span class="relative z-10 w-full text-center flex flex-col justify-center items-center gap-2">${text}</span>
        </button>`;
    };

    const Shopkeeper = (size = null, className = "") => {
      const inlineStyle = size ? `width: ${size}px; height: ${size}px;` : '';
      const eq = (typeof state !== 'undefined' && state.equippedRewards) ? state.equippedRewards : [];
      const hatOverlay = eq.includes('hat') ? `
        <svg viewBox="0 0 100 50" class="absolute -top-[14%] left-1/2 -translate-x-1/2 w-[56%] pointer-events-none z-20 drop-shadow-md">
          <path d="M18 36 Q50 2 82 36 Z" fill="#ef4444" stroke="#991b1b" stroke-width="3"/>
          <path d="M10 36 Q50 26 92 38 Q50 45 10 36 Z" fill="#b91c1c"/>
          <circle cx="50" cy="22" r="7" fill="#fef08a"/>
          <text x="50" y="25" font-size="9" font-weight="900" fill="#b91c1c" text-anchor="middle">★</text>
        </svg>` : '';
      const glassesOverlay = eq.includes('glasses') ? `
        <svg viewBox="0 0 100 35" class="absolute top-[28%] left-1/2 -translate-x-1/2 w-[44%] pointer-events-none z-20 drop-shadow-sm">
          <rect x="6" y="6" width="36" height="22" rx="8" fill="#0f172a" fill-opacity="0.82" stroke="#facc15" stroke-width="3.5"/>
          <rect x="58" y="6" width="36" height="22" rx="8" fill="#0f172a" fill-opacity="0.82" stroke="#facc15" stroke-width="3.5"/>
          <line x1="42" y1="15" x2="58" y2="15" stroke="#facc15" stroke-width="3.5"/>
          <line x1="13" y1="12" x2="23" y2="12" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
          <line x1="65" y1="12" x2="75" y2="12" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
        </svg>` : '';
      const apronOverlay = eq.includes('apron') ? `
        <svg viewBox="0 0 100 70" class="absolute bottom-[4%] left-1/2 -translate-x-1/2 w-[52%] pointer-events-none z-20 drop-shadow-md">

            <linearGradient id="goldApron" x1="0%" y1="0%" x2="100%" y2="100%">

    const renderShelfDecor = () => {

    const SpeechBubble = (text, className = "", tailPos = "bottom") => `
      <div class="relative bg-gradient-to-br from-amber-100 to-yellow-300 rounded-3xl p-3 shadow-[0_4px_0_#d97706] border-2 border-amber-400 min-w-[160px] text-center animate-bounce-slight ${className}">
        <p class="text-slate-900 font-extrabold text-sm leading-snug drop-shadow-[0_1px_1px_rgba(255,255,255,0.7)] whitespace-pre-line">${text}</p>
        ${tailPos === 'bottom'
          ? `<div class="absolute -bottom-3 left-1/2 transform -translate-x-1/2 w-0 h-0 border-l-[12px] border-l-transparent border-t-[16px] border-t-amber-400 border-r-[12px] border-r-transparent filter drop-shadow-sm"></div>`
          : `<div class="absolute -left-3 bottom-4 w-0 h-0 border-t-[8px] border-t-transparent border-r-[14px] border-r-amber-400 border-b-[8px] border-b-transparent filter drop-shadow-sm"></div>`
        }
      </div>`;

    const Firework = (delay = 0, left = '50%', top = '20%', scale = 1) => {
      const colors = ['#ef4444', '#3b82f6', '#10b981', '#facc15', '#a855f7', '#ec4899'];
      return `
        <div class="absolute pointer-events-none z-10" style="left: ${left}; top: ${top}; transform: translate(-50%, -50%) scale(${scale});">
          <svg class="w-32 h-32 animate-firework" style="animation-delay: ${delay}s" viewBox="0 0 100 100">
            ${Array.from({length: 12}).map((_, i) => `
              <g transform="rotate(${i * 30} 50 50)">
                <circle cx="50" cy="10" r="4" fill="${colors[i % colors.length]}" />
                <line x1="50" y1="50" x2="50" y2="25" stroke="${colors[(i + 1) % colors.length]}" stroke-width="3" stroke-linecap="round" opacity="0.8" />
              </g>
            `).join('')}
          </svg>
        </div>`;
    };

    // ==========================================

      lastEarnedStars: 0,
      showVictory: false,
      activeAlbum: null,
      activeHint: null,
      // Sistem Ganjaran Bintang & Mod Tauke Kedai
      bonusStars: 0,
      spentStars: 0,
      unlockedRewards: [],
      equippedRewards: [],
      cashierMode: null, // 'relaxed' | 'timed'
      cashierMission: null,
      cashierServed: 0,
      cashierSessionStars: 0,
      cashierTimeLeft: 120,
      cashierEnded: false,
      cashierHighScore: 0
    };

    let cashierTimerInterval = null;

    // ==========================================
    // 5B. STORAN KEKAL (localStorage) & GANJARAN
    // ==========================================
    const saveProgress = () => {
      try {
        localStorage.setItem(STORAGE_PREFIX + 'levelProgress', JSON.stringify(state.levelProgress));
        localStorage.setItem(STORAGE_PREFIX + 'levelStars', JSON.stringify(state.levelStars));
        localStorage.setItem(STORAGE_PREFIX + 'unlockedStickers', JSON.stringify(state.unlockedStickers));
        localStorage.setItem(STORAGE_PREFIX + 'playerName', state.playerName || '');
        localStorage.setItem(STORAGE_PREFIX + 'unlockAll', JSON.stringify(!!state.unlockAll));
        localStorage.setItem(STORAGE_PREFIX + 'cashierHighScore', JSON.stringify(state.cashierHighScore || 0));
        localStorage.setItem(STORAGE_PREFIX + 'rewards', JSON.stringify({
          bonusStars: state.bonusStars || 0,
          spentStars: state.spentStars || 0,
          unlockedRewards: state.unlockedRewards || [],
          equippedRewards: state.equippedRewards || []
        }));
      } catch (e) {
        // Abaikan jika pelayar menyekat localStorage
      }
    };

    const loadProgress = () => {
      try {
        const savedProgress = localStorage.getItem(STORAGE_PREFIX + 'levelProgress');
        if (savedProgress) {
          state.levelProgress = { ...state.levelProgress, ...JSON.parse(savedProgress) };
        }

        const savedStars = localStorage.getItem(STORAGE_PREFIX + 'levelStars');
        if (savedStars) {
          state.levelStars = { ...state.levelStars, ...JSON.parse(savedStars) };
        }

        const savedStickers = localStorage.getItem(STORAGE_PREFIX + 'unlockedStickers');
        if (savedStickers) {
          const parsed = JSON.parse(savedStickers);
          if (Array.isArray(parsed)) state.unlockedStickers = parsed;
        }

        const savedName = localStorage.getItem(STORAGE_PREFIX + 'playerName');
        if (savedName !== null) state.playerName = savedName;

        const savedUnlockAll = localStorage.getItem(STORAGE_PREFIX + 'unlockAll');
        if (savedUnlockAll) state.unlockAll = JSON.parse(savedUnlockAll) === true;

        const savedHighScore = localStorage.getItem(STORAGE_PREFIX + 'cashierHighScore');
        if (savedHighScore) {
          const parsedScore = parseInt(JSON.parse(savedHighScore), 10);
          if (!isNaN(parsedScore)) state.cashierHighScore = parsedScore;
        }

        const savedRewards = localStorage.getItem(STORAGE_PREFIX + 'rewards');
        if (savedRewards) {
          const r = JSON.parse(savedRewards);
          state.bonusStars = r.bonusStars || 0;
          state.spentStars = r.spentStars || 0;
          state.unlockedRewards = Array.isArray(r.unlockedRewards) ? r.unlockedRewards : [];
          state.equippedRewards = Array.isArray(r.equippedRewards) ? r.equippedRewards : [];
        }
      } catch (e) {
        // Abaikan jika data rosak atau localStorage disekat
      }
    };

    const clearSavedProgress = () => {
      try {
        const keysToRemove = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith(STORAGE_PREFIX)) keysToRemove.push(k);
        }
        keysToRemove.forEach(k => localStorage.removeItem(k));
      } catch (e) {
        // Abaikan jika localStorage disekat
      }
    };

    const getTotalStarsEarned = () => {
      const levelTotal = Object.values(state.levelStars).reduce((acc, s) => acc + (s || 0), 0);
      return levelTotal + (state.bonusStars || 0);
    };

    const getAvailableStars = () => {
      return Math.max(0, getTotalStarsEarned() - (state.spentStars || 0));
    };

    window.buyOrToggleReward = (itemId) => {
      const item = REWARD_ITEMS.find(r => r.id === itemId);
      if (!item) return;

      if (state.unlockedRewards.includes(itemId)) {
        if (state.equippedRewards.includes(itemId)) {
          state.equippedRewards = state.equippedRewards.filter(id => id !== itemId);
        } else {
          state.equippedRewards = [...state.equippedRewards, itemId];
        }
        playCorrect();
        saveProgress();
        renderApp();
      } else {
        if (getAvailableStars() >= item.cost) {
          state.spentStars += item.cost;
          state.unlockedRewards = [...state.unlockedRewards, itemId];
          state.equippedRewards = [...state.equippedRewards, itemId];
          playTing();
          saveProgress();
          renderApp();
        } else {
          playWrong();
        }
      }
    };

    window.unlockAllLevels = () => {
      state.unlockAll = true;
      state.showUnlockSuccess = true;
      playCorrect();
      saveProgress();
      renderApp();
    };

    window.resetAllPlayerData = () => {
      state.levelProgress = { '1A': 0, '1B': 0, '2A': 0, '2B': 0, '3A': 0, '3B': 0, '3C': 0 };
      state.levelStars = { '1A': 0, '1B': 0, '2A': 0, '2B': 0, '3A': 0, '3B': 0, '3C': 0 };
      state.unlockedStickers = [];
      state.bonusStars = 0;
      state.spentStars = 0;
      state.unlockedRewards = [];
      state.equippedRewards = [];
      state.unlockAll = false;
      state.cashierHighScore = 0;
      clearSavedProgress();
      state.showResetConfirm = false;
      state.showResetSuccess = true;
      renderApp();
    };

    // ==========================================
    // 5C. NAVIGASI & ENJIN PERMAINAN
    // ==========================================
    const stopCashierTimer = () => {
      if (cashierTimerInterval) {
        clearInterval(cashierTimerInterval);
        cashierTimerInterval = null;
      }
    };

    window.setGameState = (newState) => {
      if (newState !== 'cashier') stopCashierTimer();
      state.gameState = newState;
      state.feedback = null;
      manageAudioLoops();
      renderApp();
    };

    window.setPlayerName = (val) => {
      state.playerName = val.toUpperCase();
      saveProgress();
      const bannerNameEl = document.getElementById('banner-player-name');
      if (bannerNameEl) bannerNameEl.textContent = state.playerName || 'BIJAK';
    };

    window.setParentInput = (val) => {
      state.parentInput = val;
    };

    const getMissionData = () => state.missions[state.currentMissionIndex];

    window.startLevel = (levelType) => {
      enableAudio();
      playMusic();
      state.mistakesCount = 0;
      state.showVictory = false;
      let newMissions = [];

      const wholeItems = CATALOG.filter(item => Number.isInteger(item.price) && !['Beras', 'Telur'].includes(item.name));
      const snacksItems = CATALOG.filter(item => ['Biskut', 'Coklat', 'Air Kotak', 'Ais Krim', 'Air Mineral', 'Susu', 'Oren', 'Epal', 'Pisang', 'Roti', 'Keropok'].includes(item.name));

      if (levelType === '1A') {
        const uniqueVals = getRandomItems(PRESCHOOL_MONEY_VALUES, 5);
        for (let i = 0; i < 5; i++) {
          const val = uniqueVals[i];
          const type = val >= 1 ? 'note' : 'coin';
          const name = type === 'note' ? `Wang Kertas RM ${val}` : `Syiling ${Math.round(val * 100)} Sen`;
          newMissions.push({ level: '1A', question: `Sila berikan ${name}`, answerVal: val, answerType: type });
        }
      } else if (levelType === '1B') {
        const validPrices = [10, 5, 1, 0.50, 0.20, 0.10];
        const exactItems = CATALOG.filter(item => validPrices.includes(item.price));
        const targets = getRandomItems(exactItems, 5);
        for (let i = 0; i < 5; i++) {
          const target = targets[i];
          newMissions.push({ level: '1B', item: target, question: `Harga ${target.name} ialah ${formatMoney(target.price)}. Klik nilainya!`, answerVal: target.price });
        }
      } else if (levelType === '2A') {
        const itemGula = CATALOG.find(i => i.id === 'Gula-gula');
        const itemLollipop = CATALOG.find(i => i.id === 'Lollipop');
        const itemCoklatKecil = CATALOG.find(i => i.id === 'Coklat Kecil');

        for (let i = 0; i < 5; i++) {
          let items;
          if (i === 0) items = [itemGula, itemLollipop];
          else if (i === 1) items = [itemGula, itemCoklatKecil];
          else items = getRandomItems(snacksItems, 2);
          newMissions.push({ level: '2A', itemsToBuy: items, totalPrice: items.reduce((sum, item) => sum + item.price, 0) });
        }
      } else if (levelType === '2B') {
        const uniqueItems = getRandomItems(snacksItems.filter(i => i.price <= 9), 5);
        for (let i = 0; i < 5; i++) {
          const item = uniqueItems[i];
          let pay = item.price < 5 ? 5 : 10;
          if (item.price === 5) pay = 10;
          const change = pay - item.price;
          newMissions.push({ level: '2B', cost: item.price, pay: pay, change: change, question: `Beli ${formatMoney(item.price)}, bayar ${formatMoney(pay)}. Pilih baki ${formatMoney(change)} di rak!` });
        }
      } else if (levelType === '3A') {
        for (let i = 0; i < 5; i++) {
          let items, total;
          do {
            items = getRandomItems(wholeItems, 3);
            total = items.reduce((sum, item) => sum + item.price, 0);
          } while (total > 10);
          newMissions.push({ level: '3A', itemsToBuy: items, totalPrice: total });
        }
      } else if (levelType === '3B') {
        const budgets = [5, 6, 7, 8, 9, 10];
        const uniqueBudgets = getRandomItems(budgets, 5);
        for (let i = 0; i < 5; i++) {
          const b = uniqueBudgets[i];
          newMissions.push({ level: '3B', budget: b, question: `Beli 2 atau lebih barang berjumlah tepat ${formatMoney(b)}!` });
        }
      } else if (levelType === '3C') {
        const chosenItems = getRandomItems(snacksItems, 5);
        for (let i = 0; i < 5; i++) {
          const item = chosenItems[i];
          if (i % 2 === 0) {
            // Jenis Soalan A: Banding Harga (Pilih Paling Murah)
            const p1 = Math.floor(Math.random() * 6) + 2; // RM 2 - RM 7
            let p2 = p1 + (Math.random() < 0.5 ? 2 : -1);
            if (p2 < 1 || p2 === p1) p2 = p1 + 2;
            const cheaper = Math.min(p1, p2);
            const opts = [
              { uid: `cmp_${i}_0`, id: item.id, name: item.name, price: p1 },
              { uid: `cmp_${i}_1`, id: item.id, name: item.name, price: p2 }
            ].sort(() => Math.random() - 0.5);
            newMissions.push({
              level: '3C',
              subType: 'compare',
              question: `Mana satu ${item.name} yang PALING MURAH?`,
              options: opts,
              answerPrice: cheaper
            });
          } else {
            // Jenis Soalan B: Potongan Harga (Tolak RM atau Sen, tiada %)
            const useSen = i === 3;
            let origPrice, discount, newPrice, choicesVals;
            if (useSen) {
              const senItem = CATALOG.find(c => c.id === 'Gula-gula') || item;
              origPrice = [0.50, 0.60, 0.70, 0.80, 0.90][Math.floor(Math.random() * 5)];
              discount = [0.10, 0.20][Math.floor(Math.random() * 2)];
              newPrice = Math.round((origPrice - discount) * 100) / 100;
              choicesVals = [
                newPrice,
                Math.round((newPrice + 0.10) * 100) / 100,
                Math.max(0.10, Math.round((newPrice - 0.10) * 100) / 100)
              ];
              if (new Set(choicesVals).size < 3) choicesVals[2] = Math.round((origPrice + 0.10) * 100) / 100;
              newMissions.push({
                level: '3C',
                subType: 'discount',
                item: senItem,
                origPrice,
                discount,
                answerPrice: newPrice,
                question: `Harga asal ${formatMoney(origPrice)}. Tolak potongan ${formatMoney(discount)}. Pilih harga baharu!`,
                priceChoices: choicesVals.sort(() => Math.random() - 0.5).map((v, idx) => ({ uid: `disc_${i}_${idx}`, val: v }))
              });
            } else {
              origPrice = Math.floor(Math.random() * 6) + 3; // RM 3 - RM 8
              discount = Math.random() < 0.6 ? 1 : 2;
              newPrice = origPrice - discount;
              choicesVals = [newPrice, newPrice + 1, Math.max(1, newPrice - 1)];
              if (new Set(choicesVals).size < 3) choicesVals[2] = origPrice + 1;
              newMissions.push({
                level: '3C',
                subType: 'discount',
                item,
                origPrice,
                discount,
                answerPrice: newPrice,
                question: `Harga asal ${formatMoney(origPrice)}. Tolak potongan ${formatMoney(discount)}. Pilih harga baharu!`,
                priceChoices: choicesVals.sort(() => Math.random() - 0.5).map((v, idx) => ({ uid: `disc_${i}_${idx}`, val: v }))
              });
            }
          }
        }
      }

      state.missions = newMissions;
      state.currentLevel = levelType;
      state.currentMissionIndex = 0;
      state.newStickerWon = null;
      setupShopPhase(newMissions[0]);
    };

    const setupShopPhase = (mission) => {
      state.basket = [];
      state.tray = [];
      state.poppingBubble = null;

      if (mission.level === '1A' || mission.level === '1B') {
        const availableItems = [
          { id: 'n10', val: 10, type: 'note' }, { id: 'n5', val: 5, type: 'note' }, { id: 'n1', val: 1, type: 'note' },
          { id: 'c50', val: 0.5, type: 'coin' }, { id: 'c20', val: 0.2, type: 'coin' }, { id: 'c10', val: 0.1, type: 'coin' }
        ];
        let selectedShelf = getRandomItems(availableItems, 5);
        const hasAnswer = selectedShelf.some(item => item.val === mission.answerVal);
        if (!hasAnswer) {
          const answerItem = availableItems.find(item => item.val === mission.answerVal);
          if (answerItem) selectedShelf[0] = answerItem;
        }
        selectedShelf = selectedShelf.sort(() => Math.random() - 0.5).map((item, idx) => ({
          ...item,
          uid: `bub_${idx}_${Math.random().toString(36).substring(7)}`,
          bubbleId: `b_${idx}_${Math.random().toString(36).substring(7)}`,
          left: 5 + (idx * 18) + (Math.random() * 5) + '%',
          delay: (Math.random() * 3) + 's',
          duration: 7 + (Math.random() * 4) + 's'
        }));
        state.shelfItems = selectedShelf;
        state.tinaMsg = mission.question;
        state.gameState = 'bubbleGame';
      } else if (mission.level === '2B') {
        const availableItems = [
          { id: 'n1', val: 1, type: 'note' }, { id: 'n5', val: 5, type: 'note' },
          { id: 'n10', val: 10, type: 'note' },
          { id: 'n1_2', val: 1, type: 'note' }, { id: 'n5_2', val: 5, type: 'note' },
          { id: 'n1_3', val: 1, type: 'note' }, { id: 'n1_4', val: 1, type: 'note' }
        ];
        state.shelfItems = getRandomItems(availableItems, 6)
          .sort(() => Math.random() - 0.5)
          .map((item, idx) => ({ ...item, uid: `m2b_${idx}_${Math.random().toString(36).substring(7)}` }));
        state.tinaMsg = mission.question;
        state.gameState = 'shop';
      } else if (mission.level === '3B') {
        const wholeItems = CATALOG.filter(item => Number.isInteger(item.price) && !['Beras', 'Telur'].includes(item.name));
        state.shelfItems = getRandomItems(wholeItems, 12)
          .map((item, idx) => ({ ...item, uid: `m3b_${idx}_${Math.random().toString(36).substring(7)}` }));
        state.tinaMsg = mission.question;
        state.gameState = 'shop';
      } else if (mission.level === '3C') {
        state.shelfItems = mission.subType === 'compare' ? mission.options : mission.priceChoices;
        state.tinaMsg = mission.question;
        state.gameState = 'shop';
      } else {
        const targets = [...mission.itemsToBuy];
        const allowedDistractors = (mission.level === '2A')
          ? CATALOG.filter(i => ['Biskut', 'Coklat', 'Air Kotak', 'Ais Krim', 'Air Mineral', 'Keropok', 'Lollipop', 'Coklat Kecil', 'Gula-gula'].includes(i.id))
          : CATALOG.filter(item => Number.isInteger(item.price) && !['Beras', 'Telur'].includes(item.name));
        const distractors = getRandomItems(allowedDistractors.filter(c => !targets.map(t => t.id).includes(c.id)), 5);
        state.shelfItems = [...targets, ...distractors]
          .sort(() => Math.random() - 0.5)
          .map((item, idx) => ({ ...item, uid: `sh_${idx}_${Math.random().toString(36).substring(7)}` }));
        const itemNames = mission.itemsToBuy.map(i => i.name).join(' & ');
        state.tinaMsg = `Mari beli: ${itemNames}!`;
        state.gameState = 'shop';
      }
      manageAudioLoops();
      renderApp();
    };

    const generateWallet = (targetAmount) => {
      let required = [];
      let remaining = targetAmount;
      for (let val of ALL_MONEY_VALUES) {
        while (remaining >= val - 0.001) {
          required.push(val);
          remaining -= val;
        }
      }
      const distractors = state.currentLevel.startsWith('3') ? [1, 5, 10] : [0.5, 0.2, 0.1, 1, 5];
      const initialWallet = [...required, ...distractors].sort((a, b) => b - a);
      state.wallet = initialWallet.map((val, idx) => ({ id: `w_${idx}`, val, type: val >= 1 ? 'note' : 'coin' }));
    };

    window.handleShelfClick = (uid) => {
      const mission = getMissionData();
      if (state.feedback !== null || state.poppingBubble !== null) return;
      const clickedItem = state.shelfItems.find(item => item.uid === uid);
      if (!clickedItem) return;

      if (mission.level === '1A') {
        if (clickedItem.val === mission.answerVal && clickedItem.type === mission.answerType) {
          state.poppingBubble = clickedItem.bubbleId;
          renderApp();
          setTimeout(() => { playCorrect(); state.poppingBubble = null; successFeedback(); }, 300);
        } else {
          playWrong(); wrongFeedback("Bukan yang itu. " + mission.question);
        }
      } else if (mission.level === '1B') {
        if (clickedItem.val === mission.answerVal) {
          state.poppingBubble = clickedItem.bubbleId;
          renderApp();
          setTimeout(() => { playCorrect(); state.poppingBubble = null; successFeedback(); }, 300);
        } else {
          playWrong(); wrongFeedback(`Cari wang yang nilainya tepat ${formatMoney(mission.answerVal)}!`);
        }
      } else if (mission.level === '2B') {
        const currentSum = state.basket.reduce((acc, b) => acc + (b.val || 0), 0);
        const newSum = currentSum + clickedItem.val;
        if (Math.abs(newSum - mission.change) < 0.01) {
          playCorrect(); successFeedback();
        } else if (newSum > mission.change) {
          playWrong(); state.basket = []; wrongFeedback("Terlebih baki! Mula semula.");
        } else {
          playTone(600, 'sine', 0.1, 0.1);
          state.basket = [...state.basket, clickedItem];
          state.tinaMsg = `Baki dikumpul: ${formatMoney(newSum)}. Perlukan ${formatMoney(mission.change)}`;
          renderApp();
        }
      } else if (mission.level === '3B') {
        playTone(600, 'sine', 0.1, 0.1);
        state.basket = [...state.basket, clickedItem];
        const sum = state.basket.reduce((a, b) => a + (b.price || 0), 0);
        state.tinaMsg = `Masuk bakul! Jumlah: ${formatMoney(sum)}`;
        renderApp();
      } else if (mission.level === '3C') {
        if (mission.subType === 'compare') {
          if (Math.abs(clickedItem.price - mission.answerPrice) < 0.005) {
            playCorrect();
            successFeedback(`Bijak! ${formatMoney(clickedItem.price)} paling murah!`);
          } else {
            playWrong();
            wrongFeedback("Cuba bandingkan semula! Pilih harga yang lebih kecil.");
          }
        } else {
          if (Math.abs(clickedItem.val - mission.answerPrice) < 0.005) {
            playCorrect();
            successFeedback(`Tepat! ${formatMoney(mission.origPrice)} - ${formatMoney(mission.discount)} = ${formatMoney(mission.answerPrice)}!`);
          } else {
            playWrong();
            wrongFeedback(`Cuba kira semula: ${formatMoney(mission.origPrice)} tolak ${formatMoney(mission.discount)}.`);
          }
        }
      } else {
        const targetCount = mission.itemsToBuy.filter(i => i.id === clickedItem.id).length;
        const basketCount = state.basket.filter(i => i.id === clickedItem.id).length;
        if (basketCount < targetCount) {
          playCorrect();
          state.basket = [...state.basket, clickedItem];
          state.tinaMsg = "Bagus! Masuk dalam bakul.";
          renderApp();
          if (state.basket.length === mission.itemsToBuy.length) {
            setTimeout(() => {
              state.tinaMsg = `Jom bayar ${formatMoney(mission.totalPrice)}!`;
              generateWallet(mission.totalPrice);
              state.gameState = 'checkout';
              manageAudioLoops();
              renderApp();
            }, 1200);
          }
        } else {
          playWrong(); wrongFeedback("Kita tak perlukan ini, cari yang dalam senarai!");
        }
      }
    };

    window.moveMoneyToTray = (id) => {
      const moneyItem = state.wallet.find(m => m.id === id);
      if (!moneyItem) return;
      if (moneyItem.type === 'coin') {
        playTone(1350, 'sine', 0.08, 0.12);
        setTimeout(() => playTone(1850, 'sine', 0.06, 0.08), 35);
      } else {
        playTone(720, 'triangle', 0.07, 0.12);
      }
      state.wallet = state.wallet.filter(m => m.id !== id);
      state.tray = [...state.tray, moneyItem];
      renderApp();
    };

    window.moveMoneyToWallet = (id) => {
      const moneyItem = state.tray.find(m => m.id === id);
      if (!moneyItem) return;
      playTone(520, 'sine', 0.07, 0.1);
      state.tray = state.tray.filter(m => m.id !== id);
      state.wallet = [...state.wallet, moneyItem].sort((a, b) => b.val - a.val);
      renderApp();
    };

    window.handlePayment = () => {
      if (state.feedback !== null) return;
      const mission = getMissionData();
      const sum = state.tray.reduce((acc, item) => acc + item.val, 0);
      if (Math.abs(sum - mission.totalPrice) < 0.01) {
        playTing(); successFeedback();
      } else {
        playWrong();
        state.wobbleTray = true;
        wrongFeedback(`Alamak, jumlah belum tepat. Harga ialah ${formatMoney(mission.totalPrice)}.`);
        setTimeout(() => { state.wobbleTray = false; }, 500);
      }
    };

    const successFeedback = (customMsg = null) => {
      state.feedback = 'correct';
      state.tinaMsg = customMsg || "Wah, tepat sekali! Pandai!";
      renderApp();
    };

    let wrongTimeout = null;
    const wrongFeedback = (msg) => {
      state.mistakesCount += 1;
      state.feedback = 'wrong';
      state.tinaMsg = "Ops! Cuba lagi sekali, anda pasti boleh! 💪\n" + msg;
      renderApp();
      if (wrongTimeout) clearTimeout(wrongTimeout);
      wrongTimeout = setTimeout(() => {
        state.feedback = null;
        state.wobbleTray = false;
        renderApp();
      }, 2500);
    };

    window.nextMission = () => {
      state.feedback = null;
      if (state.gameState === 'cashier') {
        generateCashierMission();
        renderApp();
        return;
      }
      if (state.currentMissionIndex + 1 < state.missions.length) {
        state.currentMissionIndex += 1;
        setupShopPhase(state.missions[state.currentMissionIndex]);
      } else {
        handleGameComplete();
      }
    };

    const handleGameComplete = () => {
      let earnedStars = 1;
      if (state.mistakesCount === 0) earnedStars = 3;
      else if (state.mistakesCount <= 2) earnedStars = 2;

      state.levelStars[state.currentLevel] = Math.max(state.levelStars[state.currentLevel] || 0, earnedStars);
      state.lastEarnedStars = earnedStars;
      state.levelProgress[state.currentLevel] = (state.levelProgress[state.currentLevel] || 0) + 1;

      let won = null;
      if (earnedStars === 3 && state.unlockedStickers.length < STICKERS.length) {
        const allLocked = STICKERS.filter(s => !state.unlockedStickers.includes(s.id));
        if (allLocked.length > 0) {
          const levelSpecificLocked = allLocked.filter(s => s.hint.includes(state.currentLevel));
          const pool = levelSpecificLocked.length > 0 ? levelSpecificLocked : allLocked;
          won = pool[Math.floor(Math.random() * pool.length)];
          state.unlockedStickers = [...state.unlockedStickers, won.id];
          state.newStickerWon = won;
        }
      }

      saveProgress();
      state.gameState = 'result';
      state.tinaMsg = won
        ? "Wah, kamu dapat sticker baharu!"

          if (state.cashierTimeLeft <= 0) {

            if (state.cashierServed > state.cashierHighScore) {

            saveProgress();
            renderApp();

      state.tray = [];
      state.wobbleTray = false;
      const isSenMode = Math.random() < 0.4;

      if (isSenMode) {
        const senPool = [
          { id: 'Gula-gula', name: 'Gula-gula', price: 0.50 },
          { id: 'Lollipop', name: 'Lollipop', price: 0.30 },
          { id: 'Coklat Kecil', name: 'Coklat Kecil', price: 0.20 },

          { id: 'Gula-gula', name: 'Gula-gula', price: 0.40 },
          { id: 'Lollipop', name: 'Lollipop', price: 0.10 }
        ];
        let i1, i2, total;
        do {
          i1 = senPool[Math.floor(Math.random() * senPool.length)];
          i2 = senPool[Math.floor(Math.random() * senPool.length)];
          total = Math.round((i1.price + i2.price) * 100) / 100;
        } while (total >= 1.00 || total < 0.20);

        const pay = 1.00;
        const change = Math.round((pay - total) * 100) / 100;
        state.cashierMission = { isSen: true, items: [i1, i2], total, pay, change };
      } else {
        const wholePool = CATALOG.filter(i => Number.isInteger(i.price) && i.price >= 1 && i.price <= 5);

        do {
          i1 = wholePool[Math.floor(Math.random() * wholePool.length)];
          i2 = wholePool[Math.floor(Math.random() * wholePool.length)];
          total = i1.price + i2.price;

                <div class="flex flex-col items-center shrink-0">
                  ${ItemSVG(item.id, 46)}
                  <span class="text-[10px] font-bold mt-0.5 text-slate-600">${formatMoney(item.price)}</span>
                </div>`).join('')}
            </div>

            ${SpeechBubble(`Sila bayar ${formatMoney(mission.totalPrice)}`, "mb-2")}
            <div class="text-center px-2 mb-2 w-full">
              <p class="text-[11px] font-bold text-sky-800 bg-sky-100 px-3 py-1.5 rounded-xl shadow-sm border border-sky-300 leading-snug">
                💡 Klik wang di kotak bawah untuk pembetulan & pulangkan ke dompet
              </p>
            </div>

            <!-- Dulang Jumlah Bayaran -->
            <div class="w-full max-w-sm bg-gradient-to-b from-slate-200 to-slate-300 rounded-2xl p-3.5 shadow-inner border-4 ${state.wobbleTray ? 'border-red-400 animate-wobble' : 'border-slate-300'} min-h-[125px] flex flex-col">
              <div class="flex justify-between items-center mb-2 border-b-2 border-slate-400 pb-1.5">
                <span class="font-bold text-slate-600 uppercase text-xs">Jumlah Bayaran</span>
                <span class="font-black text-lg text-teal-600 bg-white px-3 py-0.5 rounded-md shadow-sm">${formatMoney(currentTotal)}</span>
              </div>
              <div class="flex-1 flex flex-wrap gap-2 justify-center items-center">
                ${state.tray.length === 0 ? `<span class="text-slate-400 font-bold text-xs italic">Tekan wang di dalam dompet untuk bayar</span>` : ''}
                ${state.tray.map(item => `
                  <div onclick="moveMoneyToWallet('${item.id}')" class="cursor-pointer hover:scale-105 transition-transform" title="Klik untuk pulangkan ke dompet">
                    ${item.type === 'note' ? NoteSVG(item.val, 85, 42) : CoinSVG(item.val, 38)}
                  </div>`).join('')}
              </div>
            </div>

            <!-- Dompet Anda (Visual Dompet Kulit Berjahit) -->
            <div class="w-full max-w-sm mt-auto pt-3">
              <div class="relative bg-gradient-to-b from-amber-800 via-amber-900 to-amber-950 rounded-t-3xl rounded-b-2xl p-3.5 shadow-[0_-6px_20px_rgba(0,0,0,0.2)] border-2 border-amber-700">
                <!-- Kancing Emas Dompet -->
                <div class="absolute -top-3 left-1/2 -translate-x-1/2 bg-gradient-to-b from-amber-600 to-amber-800 border-2 border-amber-400 px-5 py-1 rounded-full shadow-md flex items-center gap-1.5">
                  <span class="w-2.5 h-2.5 rounded-full bg-yellow-300 border border-amber-700 shadow-inner"></span>
                  <span class="text-[10px] font-black text-amber-100 tracking-wider uppercase">👛 Dompet Anda</span>
                </div>

                <!-- Jahitan Putus-putus & Butang Bayar -->
                <div class="border-2 border-dashed border-amber-500/60 rounded-2xl p-2.5 pt-3">
                  <div class="flex justify-between items-center mb-2">
                    <span class="text-[11px] font-bold text-amber-200">Klik wang untuk bayar:</span>
                    ${Button3D('BAYAR ✓', "handlePayment()", 'green', 'py-1.5 px-5 text-xs !shadow-[0_4px_0_theme(colors.teal.300)]')}
                  </div>
                  <div class="bg-amber-950/60 rounded-xl p-2.5 shadow-inner border border-amber-800/80 flex flex-wrap gap-2.5 justify-center max-h-36 overflow-y-auto">
                    ${state.wallet.length === 0 ? `<span class="text-amber-300/70 text-xs font-bold py-2">Dompet kosong</span>` : ''}
                    ${state.wallet.map(item => `
                      <div onclick="moveMoneyToTray('${item.id}')" class="cursor-pointer hover:scale-105 active:scale-95 transition-transform">
                        ${item.type === 'note' ? NoteSVG(item.val, 92, 46) : CoinSVG(item.val, 42)}
                      </div>`).join('')}
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>`;
    };

    const renderCashier = () => {
      const m = state.cashierMission;
      const currentChange = Math.round(state.tray.reduce((sum, item) => sum + item.val, 0) * 100) / 100;
      const mins = Math.floor(state.cashierTimeLeft / 60);
      const secs = state.cashierTimeLeft % 60;
      const drawerDenoms = m.isSen ? [0.50, 0.20, 0.10, 0.05] : [10, 5, 1];

      return `
        <div class="flex flex-col h-full w-full bg-emerald-50 relative overflow-hidden">
          ${renderShelfDecor()}
          <!-- Header Juruwang -->
          <div class="bg-gradient-to-r from-emerald-600 to-teal-600 shadow-md p-3 flex justify-between items-center z-20 rounded-b-3xl gap-2">
            <button onclick="setGameState('levels')" class="text-white font-bold bg-emerald-800 px-3.5 py-1.5 rounded-full border-b-4 border-emerald-950 active:border-0 active:translate-y-1 text-xs shrink-0">Tutup</button>
            <div class="bg-white/95 px-3 py-1 rounded-full font-black text-emerald-700 text-xs shadow-inner">
              👥 Dilayan: ${state.cashierServed}
            </div>
            ${state.cashierMode === 'timed'
              ? `<div id="cashier-timer" class="bg-amber-300 text-slate-900 px-3 py-1 rounded-full font-black text-xs shadow">⏱️ ${mins}:${secs < 10 ? '0' : ''}${secs}</div>`
              : `<div class="bg-amber-300 text-slate-900 px-3 py-1 rounded-full font-black text-xs shadow">⭐ +${state.cashierSessionStars}</div>`
            }
          </div>

          <!-- Paparan Pesanan Pelanggan -->
          <div class="flex-1 flex flex-col items-center pt-2 px-3 z-10 w-full overflow-y-auto">
            <div class="w-full max-w-sm bg-white rounded-2xl p-3 shadow-sm border-2 border-emerald-200 mb-2">
              <div class="flex justify-center gap-4 mb-2 pb-2 border-b border-slate-100">
                ${m.items.map(item => `
                  <div class="flex items-center gap-1.5 bg-emerald-50 px-2.5 py-1 rounded-xl border border-emerald-100">
                    ${ItemSVG(item.id, 34)}
                    <div class="text-left leading-tight">
                      <div class="text-[10px] font-bold text-slate-600">${item.name}</div>
                      <div class="text-xs font-black text-emerald-700">${formatMoney(item.price)}</div>
                    </div>
                  </div>`).join('')}
              </div>
              <div class="grid grid-cols-2 gap-2 text-center">
                <div class="bg-sky-50 rounded-xl p-1.5 border border-sky-200">
                  <div class="text-[10px] font-bold text-sky-600 uppercase">Jumlah Harga</div>
                  <div class="text-base font-black text-sky-800">${formatMoney(m.total)}</div>
                </div>
                <div class="bg-amber-50 rounded-xl p-1.5 border border-amber-200">
                  <div class="text-[10px] font-bold text-amber-700 uppercase">Pelanggan Bayar</div>
                  <div class="text-base font-black text-amber-800">${formatMoney(m.pay)}</div>
                </div>
              </div>
            </div>

            <!-- Kotak Tengah: BAKI PELANGGAN -->
            <div class="w-full max-w-sm bg-gradient-to-b from-slate-200 to-slate-300 rounded-2xl p-3 shadow-inner border-4 ${state.wobbleTray ? 'border-red-400 animate-wobble' : 'border-slate-300'} min-h-[108px] flex flex-col mb-2">
              <div class="flex justify-between items-center mb-1.5 border-b-2 border-slate-400 pb-1">
                <span class="font-black text-slate-700 uppercase text-xs">BAKI PELANGGAN</span>
                <span class="font-black text-lg text-emerald-700 bg-white px-2.5 rounded-md shadow-sm">${formatMoney(currentChange)}</span>
              </div>
              <div class="flex-1 flex flex-wrap gap-1.5 justify-center items-center">
                ${state.tray.length === 0 ? `<span class="text-slate-500 font-bold text-[11px] italic">Klik wang dalam laci di bawah untuk beri baki</span>` : ''}
                ${state.tray.map(item => `
                  <div onclick="cashierRemoveMoney('${item.id}')" class="cursor-pointer hover:scale-105 transition-transform" title="Klik untuk keluarkan">
                    ${item.type === 'note' ? NoteSVG(item.val, 76, 38) : CoinSVG(item.val, 36)}
                  </div>`).join('')}
              </div>
            </div>

            <!-- LACI DUIT KEDAI (Reka Bentuk Laci Mesin Kira Sebenar) -->
            <div class="w-full max-w-sm mt-auto pb-2">
              <div class="bg-gradient-to-b from-slate-700 via-slate-800 to-slate-900 rounded-t-2xl rounded-b-xl p-3 shadow-[0_-6px_20px_rgba(0,0,0,0.35)] border-2 border-slate-600">
                <!-- Bar Atas Laci: Lubang Kunci & Butang Pulang Baki -->
                <div class="flex justify-between items-center mb-2.5 pb-2 border-b border-slate-600/80">
                  <div class="flex items-center gap-2">
                    <!-- Lubang Kunci Logam -->
                    <div class="w-6 h-6 rounded-full bg-gradient-to-br from-slate-300 to-slate-500 border-2 border-slate-400 shadow-inner flex items-center justify-center">
                      <div class="w-1 h-3 bg-slate-900 rounded-full"></div>
                    </div>
                    <div>
                      <div class="text-[11px] font-black text-amber-300 tracking-wider uppercase leading-none">LACI DUIT KEDAI</div>
                      <div class="text-[9px] font-bold text-slate-400 mt-0.5">${m.isSen ? 'Petak Syiling Sen' : 'Petak Wang Kertas'}</div>
                    </div>
                  </div>
                  ${Button3D('PULANG BAKI ✓', "handleCashierSubmit()", 'green', 'py-1.5 px-4 text-xs !shadow-[0_4px_0_theme(colors.teal.300)]')}
                </div>

                <!-- Petak Bersekat Mesin Kira -->
                <div class="grid ${m.isSen ? 'grid-cols-4' : 'grid-cols-3'} gap-2 bg-slate-950/80 p-2 rounded-xl border border-slate-700 shadow-inner">
                  ${drawerDenoms.map(val => `
                    <div onclick="cashierAddMoney(${val})" class="relative cursor-pointer bg-gradient-to-b from-slate-700 to-slate-800 hover:from-slate-600 hover:to-slate-700 active:scale-95 transition-all rounded-lg p-1.5 pt-3 flex flex-col items-center justify-between border border-slate-600 shadow-inner min-h-[82px]">
                      ${!m.isSen
                        ? `<div class="absolute top-1 left-1/2 -translate-x-1/2 w-8 h-1.5 bg-gradient-to-b from-slate-300 to-slate-500 rounded-full shadow"></div>`
                        : `<div class="absolute top-1 left-1/2 -translate-x-1/2 w-6 h-1 bg-slate-500/70 rounded-full"></div>`
                      }
                      <div class="my-auto flex items-center justify-center pointer-events-none">
                        ${val >= 1 ? NoteSVG(val, 78, 39) : CoinSVG(val, 40)}
                      </div>
                      <span class="mt-1 bg-slate-900/90 text-amber-300 font-black text-[10px] px-2 py-0.5 rounded border border-slate-600">${formatMoney(val)}</span>
                    </div>
                  `).join('')}
                </div>

                <!-- Pemegang Laci Logam -->
                <div class="mt-2.5 flex justify-center">
                  <div class="w-24 h-2.5 bg-gradient-to-b from-slate-300 via-slate-400 to-slate-500 rounded-full border border-slate-600 shadow"></div>
                </div>
              </div>
            </div>
          </div>

          <!-- Modal Tamat Masa 2 Minit -->
          ${state.cashierEnded ? `
            <div class="absolute inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm px-4">
              <div class="bg-white rounded-3xl p-6 shadow-2xl max-w-sm w-full text-center border-4 border-emerald-300 animate-fade-in">
                <div class="text-5xl mb-2">⏱️</div>
                <h3 class="text-2xl font-black text-emerald-600 mb-1">Masa Tamat!</h3>
                <p class="text-sm font-bold text-slate-600 mb-4">Anda berjaya melayan <span class="text-emerald-600 font-black text-lg">${state.cashierServed}</span> pelanggan!</p>
                <div class="bg-amber-50 border-2 border-amber-200 rounded-2xl p-3 mb-4 space-y-1">
                  <div class="text-xs font-bold text-slate-600">Rekod Terbaik (High Score): <span class="font-black text-purple-600">${state.cashierHighScore} Pelanggan</span></div>
                  ${state.cashierServed >= 5
                    ? `<div class="text-sm font-black text-amber-600">🎉 Bonus Cabaran: +3 ⭐ Bintang!</div>`
                    : `<div class="text-xs font-bold text-slate-500">Layan 5+ pelanggan dalam 2 minit untuk bonus +3 ⭐!</div>`
                  }
                </div>
                <div class="flex gap-2">
                  ${Button3D('Main Lagi', "startCashierMode('timed')", 'green', 'flex-1 py-2 text-sm')}
                  ${Button3D('Menu Tahap', "setGameState('levels')", 'blue', 'flex-1 py-2 text-sm')}
                </div>
              </div>
            </div>` : ''}
        </div>`;
    };

    const renderResult = () => `
      <div class="flex flex-col items-center justify-center h-full text-center px-4 space-y-4 bg-gradient-to-br from-mint-50 to-sky-100 z-10 w-full relative overflow-hidden">
        ${state.lastEarnedStars === 3 ? `
          ${Firework(0, '20%', '15%', 0.8)}
          ${Firework(0.5, '80%', '25%', 1.2)}
          ${Firework(1.2, '50%', '10%', 0.9)}
          ${Firework(0.8, '15%', '50%', 0.6)}
          ${Firework(1.5, '85%', '60%', 1)}
        ` : ''}

        <div class="flex gap-2 sm:gap-4 z-20 mt-4">
          ${[1, 2, 3].map(s => `
            <svg class="w-16 h-16 sm:w-20 sm:h-20 ${state.lastEarnedStars >= s ? 'text-yellow-400 animate-bounce-slight drop-shadow-[0_4px_8px_rgba(250,204,21,0.6)]' : 'text-slate-300 grayscale opacity-50'}" style="animation-delay: ${s * 0.2}s" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" />
            </svg>`).join('')}
        </div>

        <h1 class="text-3xl font-black text-green-600 drop-shadow-sm z-20 uppercase leading-snug">Tahniah! 🎉<br/>Anda Telah Tamat<br/>Tahap Ini!</h1>

        ${state.showVictory && state.newStickerWon ? `
          <div class="bg-white px-6 py-4 rounded-3xl shadow-xl border-4 border-amber-300 z-20 animate-fade-in flex flex-col items-center">
            <span class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Sticker Baharu Dibuka!</span>
            <div class="mb-2 animate-bounce-slight">${ItemSVG(state.newStickerWon.icon, 80)}</div>
            <span class="text-sm font-black text-amber-600 mt-2">${state.newStickerWon.name}</span>
          </div>`
        : state.showVictory && !state.newStickerWon ? `
          <div class="bg-white px-6 py-4 rounded-3xl shadow-xl border-4 border-amber-300 z-20 animate-fade-in flex flex-col items-center">
            <span class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Hebat!</span>
            <span class="text-sm font-black text-amber-600 mt-2 text-center leading-tight">Semua sticker telah<br/>berjaya dikumpul! 🏆</span>
          </div>`
        : `
          <div class="flex flex-col items-center z-20 mt-2 cursor-pointer" onclick="${state.lastEarnedStars === 3 ? 'state.showVictory = true; playTing(); renderApp();' : ''}">
            ${state.lastEarnedStars === 3 ? `
              <div class="relative animate-bounce-slight hover:scale-110 transition-transform">
                <div class="text-8xl drop-shadow-2xl">🎁</div>
                <div class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-black px-2 py-1 rounded-full animate-pulse border-2 border-white shadow-md">BUKA!</div>
              </div>`
            : `
              <div class="bg-slate-100 px-6 py-4 rounded-3xl border-2 border-slate-300 flex flex-col items-center shadow-inner">
                <div class="text-5xl drop-shadow-md mb-2">🪙</div>
                <span class="text-xs font-bold text-slate-500 px-4">Dapatkan 3 Bintang ⭐⭐⭐ penuh untuk membuka kotak hadiah misteri!</span>
              </div>`}
          </div>`}

        <div class="mt-4 z-20 w-full max-w-[280px]">
          ${Button3D('Menu Tahap', "enableAudio(); state.showVictory = false; setGameState('levels');", 'blue', 'w-full text-lg py-3')}
        </div>
      </div>`;

    const renderFeedbackOverlay = () => {
      if (!state.feedback) return '';
      return `
        <div class="absolute inset-0 z-[100] flex flex-col items-center justify-center bg-white/95 backdrop-blur-sm animate-fade-in px-6 ${state.feedback === 'correct' ? 'text-green-500' : 'text-red-500'}">
          ${state.feedback === 'correct' ? `
            <div class="flex flex-col items-center text-center">
              <svg class="w-36 h-36 text-yellow-400 animate-bounce drop-shadow-xl" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" /></svg>
              <h2 class="text-4xl font-black mt-4 drop-shadow-sm text-green-500 tracking-wider">BETUL! 🎉</h2>
              <p class="text-sm font-bold text-slate-600 mt-2 max-w-xs">${state.tinaMsg}</p>
              ${Button3D('Seterusnya &rarr;', "nextMission()", 'green', 'mt-6 px-8 py-3 text-xl font-bold')}
            </div>`
          : `
            <div class="flex flex-col items-center text-center">
              ${Shopkeeper(140, 'mb-4 drop-shadow-xl')}
              <h2 class="text-xl font-black mt-2 drop-shadow-sm text-amber-600 tracking-wide bg-white px-5 py-3 rounded-3xl border-4 border-amber-300 text-center whitespace-pre-line leading-snug">
                ${state.tinaMsg}
              </h2>
            </div>`}
        </div>`;
    };

    const renderApp = () => {
      const appEl = document.getElementById('app');
      if (!appEl) return;
      let html = '';
      if (state.gameState === 'menu') html = renderMenu();
      else if (state.gameState === 'levels') html = renderLevels();
      else if (state.gameState === 'shop') html = renderShop();
      else if (state.gameState === 'bubbleGame') html = renderBubbleGame();
      else if (state.gameState === 'checkout') html = renderCheckout();
      else if (state.gameState === 'cashier') html = renderCashier();
      else if (state.gameState === 'rewards') html = renderRewardsShop();
      else if (state.gameState === 'result') html = renderResult();
      else if (state.gameState === 'stickers') html = renderStickers();
      else if (state.gameState === 'parentGate') html = renderParentGate();
      else if (state.gameState === 'parents') html = renderParentsDashboard();

      appEl.innerHTML = html + renderFeedbackOverlay();
    };

    // Muatkan data simpanan kekal & paparkan aplikasi
    loadProgress();
    renderApp();
  </script>
</body>
</html>
